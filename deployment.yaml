apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-order-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: food-order-system
  template:
    metadata:
      labels:
        app: food-order-system
    spec:
      containers:
        - name: food-order-system
          image: iamabdxllah/food-order-system:latest
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: food-order-system-service
spec:
  type: NodePort
  selector:
    app: food-order-system
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30007